
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Police Officer - Nari Suraksha</title>
  <style>
    body {
      background: linear-gradient(to right, #3a6186, #89253e);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .form-box {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 40px 50px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .form-box h2 {
      color: #fff;
      margin-bottom: 20px;
    }

    .form-box input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: none;
      border-radius: 6px;
      font-size: 14px;
    }

    .form-box input:focus {
      outline: none;
      box-shadow: 0 0 0 2px #ff4081;
    }

    .form-box button {
      width: 100%;
      padding: 12px;
      background: #ff4081;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .form-box button:hover {
      background: #d81b60;
    }

    .form-box a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <form class="form-box" action="AddPolice" method="POST">
    <h2>Add Officers</h2>
    <input type="text" name="pname" placeholder="Officer Name" required />
    <input type="text" name="pemail" placeholder="Officer Email" required />
    <input type="text" name="pcontact" placeholder="Phone Number" required />
     <input type="text" name="pstation" placeholder="Enter Station" required />
    <button type="submit">Add Officer</button>
    <a href="AdminDashboard.jsp">← Back to Dashboard</a>
  </form>

</body>
</html>
