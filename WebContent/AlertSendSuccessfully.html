<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Alert Sent</title>
  <style>
    body {
      background: linear-gradient(to right, #3a6186, #89253e);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
    }

    .response-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .response-box h2 {
      margin-bottom: 20px;
      font-size: 28px;
    }

    .response-box p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .response-box a {
      display: inline-block;
      padding: 12px 25px;
      background: #ff4081;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .response-box a:hover {
      background: #d81b60;
    }
  </style>
</head>
<body>

  <div class="response-box">
    <h2>Alert Sent Successfully!</h2>
    <p>Your safety alert has been sent to the nearest help center. Please stay calm and stay safe.</p>
    <a href="UserDashboard.html">Back to Dashboard</a>
  </div>

</body>
</html>
