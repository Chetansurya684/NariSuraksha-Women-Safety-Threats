
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Police Dashboard - Nari Suraksha</title>
  <style>
    body {
      background: linear-gradient(to right, #3a6186, #89253e);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .dashboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap:20px;
      margin-top: 30px;
      max-width: 800px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 30px;
      width: 200px;
      text-align: center;
      color: #fff;
      backdrop-filter: blur(8px);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      text-decoration: none;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.5);
    }

    .card h3 {
      margin-bottom: 15px;
    }

    .card p {
      font-size: 14px;
      color: #f1f1f1;
    }

    .card i {
      font-size: 24px;
      margin-bottom: 15px;
      display: block;
    }

    .logout-btn {
      margin-top: 10px;
      background: rgba(255, 64, 129, 0.8);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .logout-btn:hover {
      background: rgba(216, 27, 96, 0.8);
    }
  </style>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <header>Police Officer Dashboard - Nari Suraksha</header>

  <div class="dashboard">
    <a href="ViewAlertsPolice.jsp" class="card">
      <i class="fas fa-bell"></i>
      <h3>View Alerts</h3>
      <p>Check all safety alerts from users</p>
    </a>

    <a href="PoliceRespond.jsp" class="card">
      <i class="fas fa-comment-dots"></i>
      <h3>Respond to Alerts</h3>
      <p>Take action on pending alerts</p>
    </a>

    <a href="ChangePassword.jsp" class="card">
      <i class="fas fa-key"></i>
      <h3>Change Password</h3>
      <p>Update your account password</p>
    </a>

    
  <button class="logout-btn" onclick="location.href='index.jsp'">
    <i class="fas fa-sign-out-alt"></i> Logout
  </button>

</body>
</html>
