<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Delete Police Officer - Nari Suraksha</title>
  <style>
    body {
      background: linear-gradient(to right, #3a6186, #89253e);
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .delete-form {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      width: 400px;
      text-align: center;
    }

    .delete-form h2 {
      margin-bottom: 20px;
    }

    .delete-form input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    .delete-form input:focus {
      outline: none;
    }

    .delete-form button {
      width: 100%;
      padding: 12px;
      background: #ff4081;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .delete-form button:hover {
      background: #d81b60;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <form class="delete-form" action="DeletePolice" method="POST">
    <h2>Delete Police Officer</h2>
    <input type="text" name="pid" placeholder="Enter Police ID" required>
    <button type="submit">Delete</button>
    <br>
    <a href="AdminDashboard.jsp" class="back-link">← Back to Dashboard</a>
  </form>

</body>
</html>
