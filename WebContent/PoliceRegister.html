
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Police Registration - Nari Suraksha</title>
  <style>
    :root {
      --primary: #3a6186;
      --secondary: #89253e;
      --accent: #ff4081;
      --light: #f5f5f5;
      --dark: #333;
    }

    body {
      background: linear-gradient(to right, var(--primary), var(--secondary));
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .registration-container {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .registration-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: var(--secondary);
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--dark);
      font-weight: 500;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      transition: all 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--secondary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(137, 37, 62, 0.2);
    }

    .btn-register {
      width: 100%;
      padding: 12px;
      background: var(--secondary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .btn-register:hover {
      background: var(--accent);
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: var(--dark);
    }

    .login-link a {
      color: var(--secondary);
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    /* Police specific styling */
    .badge-icon {
      text-align: center;
      margin-bottom: 20px;
    }

    .badge-icon i {
      font-size: 40px;
      color: var(--secondary);
    }
  </style>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <div class="registration-container">
    <div class="badge-icon">
      <i class="fas fa-shield-alt"></i>
    </div>
    <h2>Police Officer Registration</h2>
    
    <form action="PoliceRegister" method="POST">
      <div class="form-group">
        <label for="pname">Full Name</label>
        <input type="text" id="pname" name="pname" placeholder="Enter your full name" required>
      </div>
      
      <div class="form-group">
        <label for="pstation">Police Station</label>
        <input type="text" id="pstation" name="pstation" placeholder="Enter your police station" required>
      </div>
      
      <div class="form-group">
        <label for="pcontact">Contact Number</label>
        <input type="text" id="pcontact" name="pcontact" placeholder="Enter your contact number" required>
      </div>
      
      <div class="form-group">
        <label for="pemail">Email Address</label>
        <input type="text" id="pemail" name="pemail" placeholder="Enter your email" required>
      </div>
      
      <div class="form-group">
        <label for="ppassword">Password</label>
        <input type="text" id="ppassword" name="ppassword" placeholder="Create a password" required>
      </div>
      
      
      
      
      <button type="submit" class="btn-register">Register as Police Officer</button>
    </form>
    
    <div class="login-link">
      Already registered? <a href="index.jsp">Login here</a>
    </div>
  </div>

</body>
</html>
